# /etc/slurm/plugstack.conf.d/job_usage.conf
# Must be present on login nodes (so sbatch/salloc/srun know the options)
# and on every compute node (so slurmd runs the epilog hook).
#
# optional  : a missing or broken plugin does not stop jobs from running.
# default=on: report for every job unless the user passes --job-usage=off.
optional /usr/lib64/slurm/job_usage.so helper=/software/pawsey/tools/pawseytools/bin/job_usage_epilog.sh script=/software/pawsey/tools/pawseytools/bin/job_usage.sh wait=300
